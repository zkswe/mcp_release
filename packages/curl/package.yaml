  未在本地 gitcom/AppGroup 找到 lib-curl 形态的实现仓（libcurl 8.12.1 预编译产物）。
  直接调 curl 的参考代码（别的平台/工程）：gitcom/AppGroup/oven_public/OvenPublic/src/http/*（自己的 http 封装）、
  gitcom/AppGroup/KaiduZ9/src/restclient-cpp/*（restclient-cpp）、gitcom/AppGroup/lib-h264-player/src/logic/mainLogic.cc。
  Z20 上的消费方：curl-cxx 10.0.3（Manifest.xml Z20 段）。
