deps: []   # registry 里这个版本没有 Manifest.xml；实测项目里同时声明 base-utility 一起用

usage_cpp: |
  #include "net/NetManager.h"     // NETMANAGER 宏
  #include "net/WifiManager.h"
  #include "net/NetUtils.h"

  class MyWifi : public WifiManager::IWifiListener {
    void handleWifiEnable(E_WIFI_ENABLE ev, int args) { LOGD("wifi enable ev=%d\n", (int) ev); }
    void handleWifiConnect(E_WIFI_CONNECT ev, int args) { LOGD("wifi conn ev=%d\n", (int) ev); }
    void handleWifiScanResult(std::vector<WifiInfo>* infos) { LOGD("scan n=%d\n", (int) infos->size()); }
  };
  static MyWifi sWifi;

  // ⚠️ 不要在 onUI_init / 构造函数里调 getWifiManager()，放到按钮或后台线程里惰性取
  static void onButtonClick(WifiButton* b) {
    WifiManager* w = NETMANAGER->getWifiManager();
    if (!w) return;
    w->addWifiListener(&sWifi);
    w->startScan();                       // 扫描（结果走 handleWifiScanResult 或 getWifiScanInfosLock）
    std::vector<WifiInfo> infos;
    w->getWifiScanInfosLock(infos);
    w->connect("ssid", "password");       // 连接（两参数重载，加密方式自动判定）
    w->disconnect();                      // 断开
    LOGD("ip=%s mac=%s ch=%d\n", w->getIp(), w->getMacAddr(), (int) NETMANAGER->getConnChannel());
    LOGD("iface ip=%s\n", NetUtils::getIp("wlan0"));   // NetUtils 静态工具（ifconfig 级）
  }

