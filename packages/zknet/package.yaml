gotchas:
  - "**别在 onUI_init/构造里调 NETMANAGER->getWifiManager()**：本板实测（2026-09-29）第一版就是 init 里取，页面没起来（卡在 MI_SYS_IOCTL_Init / sys.zkapp.dbg=main:onUI_init）。改成按钮/线程里惰性取后正常。"
  - "**别连着快速 setprop ctl.restart zkswe**：旧实例没退干净就起新的 → MI 全局 init 锁被占，面板黑屏、多个 zkgui 进程变 D 状态且 kill -9 无效（只能断电重启）。部署脚本要「先确认无残留 pid 再起，单次 restart」。"
  - "**enableWifi(false) 会断 adb**（adb 走 WiFi 192.168.x.x:5555）→ 自动化测试必须自带恢复（本包示例 10s 后自动 enableWifi(true)）。"
  - "**连接前先扫到目标 SSID 再 connect**：模组刚枚举完时直接 connect 容易失败（WifiTest-New 的做法是多轮扫描→命中后 connect）。"
  - "**getConnectionInfo() 的 RSSI/Freq 在这块板上返回 0**（未填充）→ 想要信号强度用扫描结果里的 WifiInfo::getRssi()，或底层 WifiCtrl::signalPoll()。"
  - "IWifiListener 的回调跑在 zknet 自己的线程里 → 回调里只置标志/打日志，状态一律以 manager 读回为准，别在回调里直接刷 UI。"

