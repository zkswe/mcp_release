summary: >
  网络总门面：WiFi（开关/扫描/连接/断开/静态IP/MAC/IP）、以太网、SoftAP 热点、4G，
  外加 NetUtils 静态 iface 工具（ifconfig 级）。Manifest 里声明即可用，入口是 net/NetManager.h 的 NETMANAGER 宏。

entry: "net/NetManager.h → NETMANAGER (= NetManager::getInstance())"
source: >
  包本体只发 include/ + libzknet.so（无 README/Manifest）；
  本地 gitcom 里 lib-networking（networking 包）反向依赖 zknet（<net/NetManager.h>），未找到 zknet 自身实现仓。

headers:
  - path: include/net/NetManager.h
    role: 总入口：getWifiManager / getEthernetManager / getLTE4GManager / getSoftApManager / getConnChannel / INetChannelChangedListener
  - path: include/net/WifiManager.h
    role: WiFi 全生命周期 + IWifiListener（5 个回调）
  - path: include/net/WifiInfo.h
    role: 单个 AP 的信息（ssid/bssid/rssi/freq/encryption/level/statement）
  - path: include/net/NetUtils.h
    role: 静态工具：getIp/getMacAddr/configure/getConfigureInfo/enableIfc/dhcpRequestIp/dhcpReleaseIp
  - path: include/net/SoftApManager.h
    role: 热点：setEnable/isEnable/getSoftApState/setSsidAndPwd/getSsid/getPwd/getIp + 状态监听
  - path: include/net/EthernetManager.h
    role: 以太网：isSupported/isConnected/getIp/getMacAddr/configure/setAutoMode + 连接状态监听
  - path: include/net/LTE4GManager.h
    role: 4G：setPower/getPowerState/getIMEI/getICCID/getIMSI/queryRSSI + 电源状态监听
  - path: include/net/WifiCtrl.h
    role: 底层 wpa_supplicant 控制（scanResults/signalPoll/status/addNetwork…），一般不用直接碰

