  steps:
    - "HTTP GET（LAN 测试服务）-> 200 OK 33 B；HTTP POST -> 200 OK 51 B（回显校验）"
    - "HTTPS GET -> 首次 FAIL `SSL certificate problem: certificate is not yet valid`（F133 上电 RTC=1970）→ **NTP 校时后复跑 200 OK / 29506 B**"
    - "NTP syncTime(defaultServerList, 3000) -> 成功（1970-01-01 09:28:51 → 2026-09-29 13:47:45，TZ=UTC-8）"
    - "http::Downloader 双任务 -> 2/2 成功（307200 B + 81 B），进度回调逐段上报"
    - "http::WebSocket -> sendFrame 17 B → receiveFrame 22 B = \"echo:echo:hello-ws-from-z21\" → close()"
    - "SoftAp：setEnable(true) 15s 内未起来（isEnable=0 / state=DISABLED）-> **F133 平台结论：本板 SoftAp 开不起来**（与 Z20/Z21 不同）"
    - "Ethernet：isSupported=0（该板无以太网管理面）；getStaticConfigureInfo 可读；setAutoMode(true) OK"
