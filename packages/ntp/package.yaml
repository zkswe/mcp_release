  new_gotchas:
    - "**F133 上电 RTC=1970** → 带证书校验的 HTTPS/TLS 报 `certificate is not yet valid`（与 Z21 同款坑）→ **必须先 NTP 校时再 HTTPS**"
    - "**F133 的 /data 只有 320KB（81% 已用）** → 下载/落盘别写 /data（我这次实测写 300KB 就快把它塞满）；用 **/tmp**（tmpfs 121MB）或 /mnt/extsd"
    - "**F133 的 /mnt/sdnand 只读** → 落盘同样别选它"
    - "SoftAp 在 F133 上开不起来（15s 未 ENabled）→ 要 AP 模式得换平台/方案"
