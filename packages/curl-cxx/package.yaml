  - "packages/ntp/package.yaml（HS 之前的校时）"
  - "packages/mqtt-cxx/package.yaml（MQTT；Z20 上依赖 paho-mqtt3as + openssl）"
  - "projects/pkg_netstack（真机验证工程：HTTP/HTTPS/NTP/MQTT 一键自检）"

