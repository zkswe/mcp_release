gotchas:
  - "**HTTPS 前先校时**（包 README 第 1 条）：系统时间不对 → 证书校验直接失败。用 ntp 包同步后再发 HTTPS。"
  - "**cacert.pem 的实际加载位置 = 资源目录（resPath）下，不是随便哪个 resources/ 目录**：实测 resPath=/tmp/ui 时，只有 /tmp/ui/cacert.pem 能通过校验；放 /tmp/resources/cacert.pem、/tmp/cacert.pem 都报 `mbedTLS: The certificate is not correctly signed by the trusted CA`（这个报错是「没找到/用错 CA」，不是「服务器证书坏」）。正常部署 resPath=/res/ui → 即与 ftu 同级。"
  - "Z20 的 curl 是 **8.12.1-mbedtls** 变体（不是 openssl 变体）：feature report 显示 **IPv6=no、无内置 CA bundle/path/embed** → 必须自带 cacert.pem；历史上「缺 CA 不是优雅报错而是进程崩→看门狗反复重启」（references/kb/build.md 有记录）。"
  - "http::Axios 全是**阻塞**调用 → 必须放 worker 线程；本示例用 pthread + 日志缓冲，主线程只刷 UI。"
  - "非 2xx 会抛 base::Exception（下载接口按 README：状态码非 200/206 或长度不符即失败）→ 一定要 try/catch，否则 worker 线程里异常会中断整个任务链。"
  - "同一个工程里 HTTP 走 mbedtls、MQTT(paho) 走 openssl → 会链进两套 TLS，体积/内存要算进去。"

