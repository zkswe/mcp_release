usage_cpp: |
  #include <http/axios.h>
  #include <base/exception.h>

  // ⚠️ 阻塞 API：丢到 worker 线程里跑，别在 UI 线程直接调
  static void doGet() {
    try {
      http::Axios ios;
      http::AxiosRequestConfig cfg;
      cfg.setConnectTimeout(3000);
      cfg.setTimeout(10000);
      http::AxiosResponse r = ios.GET("http://192.168.x.x:8000/hello.txt", cfg);
      LOGD("status=%d bytes=%d ctype=%s", r.status, (int) r.data.size(), r.getContentType().c_str());
      LOGD("body=%s", r.data.c_str());

      // POST（带自定义头）
      http::Headers h; h["Content-Type"] = "application/json";
      cfg.setHeaders(h);
      http::AxiosResponse p = ios.POST("http://192.168.x.x:8000/echo", "{\"k\":\"v\"}", cfg);
      LOGD("post=%d echo=%s", p.status, p.data.c_str());

      // HTTPS（需 ① 先校时 ② cacert.pem 放资源目录，见 gotchas）
      http::AxiosResponse s = ios.GET("https://www.baidu.com", cfg);
      LOGD("https=%d bytes=%d", s.status, (int) s.data.size());
    } catch (base::Exception& e) {
      LOGD("http 异常: %s", e.what());
    }
  }

