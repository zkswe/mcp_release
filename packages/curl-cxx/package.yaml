    header: http/axios.h
    methods:
      - "AxiosResponse GET(const std::string& url);"
      - "AxiosResponse GET(const std::string& url, const AxiosRequestConfig& config);"
      - "AxiosResponse POST(const std::string& url, const std::string& data);"
      - "AxiosResponse POST(const std::string& url, const std::string& data, const AxiosRequestConfig& config);"
      - "AxiosResponse POST(const std::string& url, const FormData& data);"
      - "AxiosResponse PUT(const std::string& url, const std::string& data, const AxiosRequestConfig& config);"
      - "AxiosResponse DELETE(const std::string& url);"
      - "AxiosResponse HEAD(const std::string& url);"
      - "AxiosResponse request(const AxiosRequestConfig& config);"
