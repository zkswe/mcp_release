summary: >
  HTTP/HTTPS 客户端（C++ 封装）：http::Axios（GET/POST/PUT/PATCH/DELETE/HEAD/OPTIONS/request）、
  http::AxiosRequestConfig（baseURL/headers/query/超时）、http::AxiosResponse、http::FormData（multipart）、
  http::Downloader（多任务下载 + 进度回调）。Z20 走 curl 8.12.1-mbedtls。

entry: "#include <http/axios.h>"
source: "未在本地 gitcom/AppGroup 找到 lib-curl-cxx 形态的源码仓（只有编译好的 .a + 头文件 + README）"

headers:
  - path: include/http/axios.h
    role: 主类 http::Axios（GET/POST/DELETE/PUT/PATCH/HEAD/OPTIONS/request + defaults 默认配置）
  - path: include/http/axios_request_config.h
    role: 请求配置（baseURL/headers/queryParams/超时/SSL 等）
  - path: include/http/axios_response.h
    role: 响应（status / status_text / headers / data + getContentLength/getContentType）
  - path: include/http/downloader.h
    role: 下载器（单例 instance() + add(Task) + 静态 download(...)，支持进度/结果回调、低速超时、重试）
  - path: include/http/form_data.h
    role: multipart/form-data 表单（append / appendFile）
  - path: include/http/easy.h
    role: libcurl easy handle 的薄包装（Axios 内部用；高级用法可绕）
  - path: include/http/web_socket.h
    role: WebSocket 客户端（依赖 curl 的 ws 支持）

api:
