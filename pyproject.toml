[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flythings-mcp-open"
# ⚠️ PEP440 不接受 "-open" 后缀：这里只放数字部分；唯一真相是 kb_tools.MCP_VERSION，
#    scripts/check_consistency.py 会校验两者一致（0.27.37-open <-> 0.27.37）。
version = "0.27.200"
description = "FlyThings 开发能力 MCP 服务器（open 版）：单入口 43 个 op，覆盖建工程→布局→资源→编译→部署→验收→i18n"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "Pillow>=10",
    "numpy>=1.24",
]

[project.scripts]
flythings-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://gitee.com/Kwolve/flythingsmcp_release"
Documentation = "https://developer.flythings.cn/"

[tool.flythings]
# 与 kb_tools.MCP_VERSION 保持一致（由 scripts/check_consistency.py 校验）
mcp_version = "0.27.200-open"
# 依赖组合的唯一真相是 requirements.lock（本文件的 dependencies 只给 pip 解析用范围）
verified_python = "3.13.13"

[tool.setuptools]
# 根目录**所有** .py 都要登记（漏一个 = pip 装出来的包缺模块、运行时 ImportError）。
# 清单不许靠人维护：scripts/check_consistency.py 的 stage_package_manifest 会比对
# 「根目录 .py 集合 == py-modules」，漏了直接红。
py-modules = [
    "adb_tools",
    "configure",
    "derived_md",
    "symptom_loader",
    "embed_local",
    "font_tools",
    "hardware_tools",
    "help_tools",
    "i18n_tools",
    "device_probes",
    "kb_authority",
    "lifecycle_loader",
    "components_catalog",
    "logic_tools",
    "media_cap_loader",
    "kb_index_roots",
    "kb_local",
    "kb_tools",
    "mcp_extras",
    "mcp_server",
    "mcp_server_flat",
    "op_spec_loader",
    "package_tools",
    "platform_cap_loader",
    "platforms",
    "preflight",
    "preflight_loader",
    "flow_loader",
    "project_state",
    "error_codes_loader",
    "progress",
    "project_tools",
    "rag_search",
    "rebuild_index_local",
    "selfcheck_tools",
    "test_tools",
    "translate_tools",
    "ui_baseline",
]
