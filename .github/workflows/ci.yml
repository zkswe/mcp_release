name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  offline-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装已锁依赖
        run: pip install -r requirements.lock
      - name: 语法检查
        run: python -m compileall -q . > /dev/null
      - name: 契约用例
        run: python -m unittest discover -s tests -q
      - name: 一致性 + 冒烟（发布前置闸门）
        run: python scripts/check_consistency.py --with-tests
        # 真机相关用例自动跳过（CI 无设备；--screenshot 只在本地带设备时手动跑）
