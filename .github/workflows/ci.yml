name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  offline-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装已锁依赖
        run: pip install -r requirements.lock
      - name: 语法检查
        run: python -m compileall -q . > /dev/null
      # 契约用例只跑一遍（2026-10-03）：`--with-tests` 内含全量用例 + 条数核对，
      # 单独再跑一次等于把分钟级的离线用例白跑第二遍。
      - name: 一致性 + 用例 + 冒烟（发布前置闸门）
        run: python scripts/check_consistency.py --with-tests
        # 真机相关用例自动跳过（CI 无设备；--screenshot 只在本地带设备时手动跑）。
        # 契约用例的离线由 tests/_util.py 的 adb 守卫保证（不需要设备也能稳定跑完）。
